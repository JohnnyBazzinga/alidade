<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-labelledby="skeleton-title skeleton-desc" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="skeleton-title">The Alidade skeleton and the two apps built on it</title>
  <desc id="skeleton-desc">Core, Sensors and UI form the skeleton. Vigia uses Core's bearing model and adds sharing and incidents: many observers at known places, one unknown smoke. Nonius adds a Sun altitude model and calibration: the Sun at a known place, one unknown observer. Both use the same solver.</desc>

  <!-- A background of its own, so that the picture reads on a light or a dark page. -->
  <rect x="0" y="0" width="700" height="460" rx="10" fill="#0C0F12"/>

  <!-- The two apps -->
  <rect x="20" y="20" width="320" height="200" rx="8" fill="#141A1F" stroke="#6A7884" stroke-width="1.5"/>
  <text x="36" y="52" font-size="22" font-weight="700" fill="#ECE8DC">Vigia</text>
  <text x="36" y="76" font-size="14" fill="#AEB6BD">wildfire smoke triangulation</text>
  <rect x="36" y="96" width="288" height="108" rx="6" fill="#1D252C" stroke="#E3AE45" stroke-width="1.5"/>
  <text x="48" y="118" font-size="14" fill="#AEB6BD">uses Core's bearing model;</text>
  <text x="48" y="136" font-size="14" fill="#AEB6BD">adds sharing and incidents</text>
  <text x="48" y="162" font-size="14" fill="#ECE8DC">many observers at known places</text>
  <text x="48" y="190" font-size="14" fill="#E3AE45">→ one unknown smoke</text>

  <rect x="360" y="20" width="320" height="200" rx="8" fill="#141A1F" stroke="#6A7884" stroke-width="1.5"/>
  <text x="376" y="52" font-size="22" font-weight="700" fill="#ECE8DC">Nonius</text>
  <text x="376" y="76" font-size="14" fill="#AEB6BD">a position fix from the Sun</text>
  <rect x="376" y="96" width="288" height="108" rx="6" fill="#1D252C" stroke="#E3AE45" stroke-width="1.5"/>
  <text x="388" y="118" font-size="14" fill="#AEB6BD">adds Sun altitude model</text>
  <text x="388" y="136" font-size="14" fill="#AEB6BD">and calibration</text>
  <text x="388" y="162" font-size="14" fill="#ECE8DC">the Sun at a known place</text>
  <text x="388" y="190" font-size="14" fill="#E3AE45">→ one unknown observer</text>

  <!-- Arrows from the apps to the skeleton -->
  <g stroke="#E3AE45" stroke-width="2" fill="none">
    <path d="M180 220 V274"/>
    <path d="M520 220 V274"/>
  </g>
  <g fill="#E3AE45">
    <path d="M172 272 L180 286 L188 272 Z"/>
    <path d="M512 272 L520 286 L528 272 Z"/>
  </g>
  <text x="350" y="258" font-size="14" text-anchor="middle" fill="#ECE8DC">the same solver, the same 95 % ellipse</text>

  <!-- The skeleton -->
  <text x="20" y="312" font-size="14" font-weight="700" fill="#AEB6BD">THE SKELETON</text>
  <rect x="20" y="322" width="210" height="104" rx="8" fill="#141A1F" stroke="#6A7884" stroke-width="1.5"/>
  <text x="36" y="352" font-size="18" font-weight="700" fill="#ECE8DC">Core</text>
  <text x="36" y="376" font-size="14" fill="#AEB6BD">angles, geodesy,</text>
  <text x="36" y="396" font-size="14" fill="#AEB6BD">solver, ellipse</text>

  <rect x="245" y="322" width="210" height="104" rx="8" fill="#141A1F" stroke="#6A7884" stroke-width="1.5"/>
  <text x="261" y="352" font-size="18" font-weight="700" fill="#ECE8DC">Sensors</text>
  <text x="261" y="376" font-size="14" fill="#AEB6BD">orientation, GPS,</text>
  <text x="261" y="396" font-size="14" fill="#AEB6BD">declination,</text>
  <text x="261" y="414" font-size="14" fill="#AEB6BD">simulator</text>

  <rect x="470" y="322" width="210" height="104" rx="8" fill="#141A1F" stroke="#6A7884" stroke-width="1.5"/>
  <text x="486" y="352" font-size="18" font-weight="700" fill="#ECE8DC">UI</text>
  <text x="486" y="376" font-size="14" fill="#AEB6BD">camera, reticle, map,</text>
  <text x="486" y="396" font-size="14" fill="#AEB6BD">ellipse, simulator</text>

  <text x="350" y="448" font-size="13" text-anchor="middle" fill="#AEB6BD">imports point one way: apps → ui → sensors → core</text>
</svg>
